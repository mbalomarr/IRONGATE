services:
  mysql:
    image: mysql:8.0
    container_name: irongate-mysql
    environment:
      MYSQL_DATABASE: irongate
      MYSQL_USER: irongate
      MYSQL_PASSWORD: irongate
      MYSQL_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - irongate-mysql:/var/lib/mysql

volumes:
  irongate-mysql:
